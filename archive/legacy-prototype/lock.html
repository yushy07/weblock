<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Locked</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      background: #1c1c1c;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      width: 300px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .lock-icon { font-size: 40px; margin-bottom: 10px; }
    h2 { color: #fff; margin: 0 0 4px; }
    p { color: #999; font-size: 13px; margin: 0 0 20px; word-break: break-all; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: #fff;
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #4a7dff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #3a6ae8; }
    .error { color: #ff5c5c; font-size: 13px; height: 16px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock-icon">🔒</div>
    <h2>Site Locked</h2>
    <p id="siteName"></p>
    <input type="password" id="pw" placeholder="Enter password" autofocus />
    <button id="unlockBtn">Unlock</button>
    <div class="error" id="err"></div>
  </div>
  <script src="hash.js"></script>
  <script src="lock.js"></script>
</body>
</html>
